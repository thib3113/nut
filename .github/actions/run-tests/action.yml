name: 'setup nodejs'
inputs:
  GITHUB_TOKEN:
    description: "the github token"
    required: true

runs:
  using: "composite"
  steps:

    - name: Download artifact
      uses: actions/download-artifact@v5
      with:
        name: test-nut
        path: /tmp

    - name: Load Docker image
      shell: bash
      run: |
        docker load --input /tmp/nut-test.tar

    - name: start nut
      shell: bash
      run: |
        docker run -d -p 3493:3493 --name nut-server nut-test:latest
        echo "Container started: nut-server"

    - name: Wait for container to initialize
      shell: bash
      run: sleep 5

    - name: Show container logs
      shell: bash
      run: |
        echo "=== Container logs ==="
        docker logs nut-server
        echo "=== End of container logs ==="

    - name: Run tests
      shell: bash
      run: pnpm run test:ci:coverage
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        CI: true
        DEBUG: nut-client:*
